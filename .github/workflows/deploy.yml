name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시되면 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 인텔 기반 가상 서버 대여

    steps:
    # 1. 소스 코드 가져오기
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. 도커 허브 로그인 (깃허브 Secret 변수 활용)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. 가상 서버 내부에서 인텔 기반 이미지 빌드 및 푸시
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        # ⚠️ '내-도커-계정명'과 '내-앱-이름'을 본인 스토리지에 맞게 수정하세요.
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest

