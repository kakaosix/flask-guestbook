name: Build and Deploy (CI/CD)

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # 빌드가 반드시 성공해야만 배포를 시작합니다.

    steps:
    # SSH 원격 접속 후 서버 컴퓨터 터미널에서 아래 명령어들을 차례로 실행합니다.
    - name: Executing remote ssh commands using password
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          echo "🚀 1. 도커 허브에서 최신 이미지 가져오기..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest

          echo "🧹 2. 기존 실행 중인 컨테이너 안전하게 정리하기..."
          # 기존 컨테이너가 있으면 멈추고 지웁니다. (에러 방지를 위해 || true 처리)
          docker stop guestbook || true
          docker rm guestbook || true

          echo "🏃 3. 새 이미지로 컨테이너 실행하기..."
          docker run -d -p 5010:5000 --name guestbook ${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest

          echo "🧼 4. 안 쓰는 옛날 이미지(찌꺼기) 청소하기..."
          docker image prune -f

          echo "🎉 배포가 성공적으로 완료되었습니다!"
